# Author: André Henrique (@mrhenrike) | União Geek — https://github.com/Uniao-Geek

name: compatibility-matrix

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  smoke:
    name: "${{ matrix.os }} / py${{ matrix.python-version }}"
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install runtime requirements
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -r requirements.txt

      - name: Validate module indexing and imports
        run: |
          python -c "
          import sys; sys.path.insert(0, '.')
          from firewallxpl.core.exploit.utils import index_modules
          modules = index_modules()
          assert len(modules) >= 100, f'Expected 100+ modules, got {len(modules)}'
          print(f'OK: {len(modules)} modules indexed')
          "

      - name: Validate Python syntax compilation
        run: |
          python -m compileall -q firewallxpl tools

      - name: Validate coverage minimums
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.11'
        run: |
          python tools/validate_coverage_minimums.py

  quality-security:
    name: "quality-security / ubuntu / py3.12"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install runtime requirements
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -r requirements.txt

      - name: Install security audit tooling
        run: |
          python -m pip install pip-audit flake8 bandit

      - name: Validate dependency graph integrity
        run: |
          python -m pip check

      - name: Lint gate (critical errors)
        run: |
          flake8 tools fxf.py --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Validate Python syntax compilation
        run: |
          python -m compileall -q firewallxpl tools

      - name: Validate coverage minimums
        run: |
          python tools/validate_coverage_minimums.py

      - name: Validate governance baseline
        run: |
          python tools/validate_governance.py

      - name: Build attack matrix snapshot
        run: |
          python tools/build_attack_matrix.py

      - name: Build curated arsenal index
        run: |
          python tools/build_arsenal_index.py

      - name: Validate curated arsenal architecture
        run: |
          python tools/validate_arsenal.py

      - name: Dependency vulnerability audit
        run: |
          pip-audit -r requirements.txt --progress-spinner off

      - name: Static security review (bandit)
        run: |
          bandit -q -r tools -lll

      - name: Refresh intel and honeypot snapshots (non-gating)
        continue-on-error: true
        run: |
          python tools/intel_backlog.py
          python tools/validate_honeypot_traps.py

  dependency-review:
    name: "dependency-review / pull_request"
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Dependency review
        uses: actions/dependency-review-action@v4
