# Author: André Henrique (@mrhenrike) | União Geek — https://github.com/Uniao-Geek
#
# SECURITY HARDENING:
# - Actions pinned to full SHA (supply chain protection)
# - Fork guard: github.repository check blocks fork execution
# - Package name assertion before build
# - Environment "pypi" requires manual approval from @mrhenrike
# - Branch policy: only master can deploy
# - persist-credentials: false prevents token leakage
# - Minimal permissions per job

name: publish-pypi

on:
  release:
    types: [published]
  workflow_dispatch:

permissions: {}

jobs:
  build:
    name: Build package
    runs-on: ubuntu-latest
    if: github.repository == 'mrhenrike/FirewallXPL-Forge'
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Verify package metadata integrity
        run: |
          python -c "
          import tomllib
          with open('pyproject.toml', 'rb') as f:
              data = tomllib.load(f)
          name = data['project']['name']
          assert name == 'firewallxpl', f'ALERT: unexpected package name: {name}'
          version = data['project']['version']
          print(f'Verified: {name} v{version}')
          "

      - name: Install build tools
        run: pip install build

      - name: Build sdist and wheel
        run: python -m build

      - name: Verify built artifacts
        run: |
          ls -la dist/
          python -c "
          import zipfile, os
          for f in os.listdir('dist'):
              if f.endswith('.whl'):
                  with zipfile.ZipFile(os.path.join('dist', f)) as z:
                      # Use endswith to avoid matching MIB/resource files that contain METADATA in path
                      meta = [n for n in z.namelist() if n.endswith('.dist-info/METADATA')][0]
                      content = z.read(meta).decode()
                      assert 'Name: firewallxpl' in content, f'ALERT: wheel metadata mismatch. Name line: {[l for l in content.splitlines() if l.startswith(\"Name:\")]}'
                      print(f'Wheel verified: {f}')
          "

      - name: Upload artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dist
          path: dist/

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    if: github.repository == 'mrhenrike/FirewallXPL-Forge'
    permissions:
      id-token: write
    environment:
      name: pypi
      url: https://pypi.org/project/firewallxpl/

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI (Trusted Publisher / OIDC)
        uses: pypa/gh-action-pypi-publish@release/v1
