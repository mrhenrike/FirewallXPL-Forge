title: Credential Dumping via LSASS Memory Access
id: b8d3e2f5-0c7a-4f9b-a6d4-3e2c1f4b7a8d
status: test
description: |
  Detects attempts to access the LSASS process memory, a common technique
  used by tools such as Mimikatz, ProcDump, and Windows Task Manager exports
  to dump password hashes and plaintext credentials.
  Aligned with SOC Detection Lab telemetry from the Windows Audit Process
  policy and Sysmon Event ID 10.
references:
  - https://attack.mitre.org/techniques/T1003/001/
  - https://www.ultimatewindowssecurity.com/securitylog/encyclopedia/event.aspx?eventID=4656
author: André Henrique (@mrhenrike) | União Geek
date: 2026-06-07
tags:
  - attack.credential_access
  - attack.t1003.001
logsource:
  product: windows
  category: process_access
detection:
  selection:
    TargetImage|endswith: '\lsass.exe'
    GrantedAccess|contains:
      - '0x1010'
      - '0x1410'
      - '0x147a'
      - '0x1fffff'
      - '0x1f0fff'
  filter_system:
    SourceImage|contains:
      - 'C:\Windows\System32\'
      - 'C:\Windows\SysWOW64\'
  filter_antivirus:
    SourceImage|contains:
      - 'MsMpEng.exe'
      - 'MBAMService.exe'
      - 'bdagent.exe'
  condition: selection and not 1 of filter_*
falsepositives:
  - Legitimate antivirus and security products reading LSASS for scanning
  - Windows Defender and endpoint protection solutions
level: high
fields:
  - SourceImage
  - TargetImage
  - GrantedAccess
  - CallTrace
